<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dream House · 有树、钢琴与海之门的两层梦境小屋</title>
    <meta name="description" content="Dream House 是一栋可以切换外观、一楼与二楼的三维童话小屋：一楼保留树、女孩、钢琴、书桌和通往大海的门，二楼等待下一段梦境。">

    <meta property="og:title" content="Dream House · 两层三维梦境小屋">
    <meta property="og:description" content="从完整的童话屋切进一楼与空置二楼；点树、海之门、钢琴与书桌继续女孩的故事。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moltpany.github.io/dream-room/">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23284a52'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23f4f0e5' font-family='serif'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="dream.css">

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/examples/jsm/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
          "three/examples/jsm/geometries/RoundedBoxGeometry.js": "./vendor/three/RoundedBoxGeometry.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="dream-shell">
      <header class="dream-header">
        <a class="brand" href="https://moltpany.github.io/" aria-label="返回 Moltpany 首页">
          DREAM<span>/HOUSE</span>
        </a>
        <div class="header-links">
          <span class="chapter">HOUSE 01 · THE TREE &amp; THE SEA</span>
          <a href="https://moltpany.github.io/">← Moltpany</a>
          <a href="https://github.com/moltpany/dream-room" rel="noopener">源码</a>
        </div>
      </header>

      <section class="scene-card" aria-label="一栋可以切换外观、一楼与二楼的可交互三维梦境小屋">
        <div id="scene-mount" class="scene-mount"></div>

        <div id="scene-fallback" class="scene-fallback" hidden>
          <strong>这台设备暂时打不开这间房间</strong>
          <p>Dream Room 需要浏览器支持 WebGL。请换用较新的 Chrome、Edge、Safari 或 Firefox，并确认没有关闭硬件加速。</p>
        </div>

        <div class="room-title">
          <span id="view-eyebrow">梦境小屋 / HOUSE</span>
          <strong id="view-title">A little house can hold a whole world.</strong>
        </div>

        <div class="view-switcher" aria-label="小屋视角">
          <button class="is-active" data-view="house"><small>HOUSE</small><span>整栋小屋</span></button>
          <button data-view="ground"><small>ROOM 01</small><span>一楼</span></button>
          <button data-view="upper"><small>ROOM 02</small><span>空置二楼</span></button>
        </div>

        <div class="story-actions" aria-label="互动选择">
          <button data-action="tree">
            <span>01</span>
            <strong>爬树与体操下杠</strong>
            <small>CLIMB · SWING · 360°</small>
          </button>
          <button data-action="door">
            <span>02</span>
            <strong>打开海之门</strong>
            <small>OPEN &amp; SWIM</small>
          </button>
          <button data-action="piano">
            <span>03</span>
            <strong>坐下弹钢琴</strong>
            <small>PLAY &amp; LISTEN</small>
          </button>
          <button data-action="desk">
            <span>04</span>
            <strong>在书桌前学习</strong>
            <small>READ &amp; WRITE</small>
          </button>
        </div>

        <div class="interaction-hint" aria-live="polite">
          <span class="hint-dot"></span>
          <span id="interaction-status">正在加载三维场景…</span>
        </div>

        <button class="reset-button" id="reset-button" aria-label="重置女孩和房间动画">
          ↻ 重置故事
        </button>
      </section>

      <footer class="dream-footer">
        <span>拖拽旋转 · 滚轮缩放 · 点击互动</span>
        <span>TREE · PIANO · STUDY · SEA BEYOND THE DOOR</span>
      </footer>
    </main>

    <script type="module">
      import { createDreamRoom } from "./scene.js";

      const mount = document.getElementById("scene-mount");
      const fallback = document.getElementById("scene-fallback");
      const statusLine = document.getElementById("interaction-status");
      const buttons = [...document.querySelectorAll(".story-actions button")];
      const viewButtons = [...document.querySelectorAll(".view-switcher button")];
      const viewEyebrow = document.getElementById("view-eyebrow");
      const viewTitle = document.getElementById("view-title");
      const viewTitles = {
        house: ["梦境小屋 / HOUSE", "A little house can hold a whole world."],
        ground: ["梦境房间 / 01", "Some doors open into the sea."],
        upper: ["梦境房间 / 02", "An empty room, waiting for its dream."],
      };

      // WebGL is the one hard requirement; say so plainly rather than
      // leaving an empty grey rectangle behind.
      const supportsWebGL = (() => {
        try {
          return Boolean(document.createElement("canvas").getContext("webgl2"));
        } catch {
          return false;
        }
      })();

      if (!supportsWebGL) {
        mount.hidden = true;
        fallback.hidden = false;
        statusLine.textContent = "无法初始化 WebGL";
      } else {
        const room = createDreamRoom(mount, {
          onStatus: (message) => {
            statusLine.textContent = message;
          },
          onActive: (action) => {
            for (const button of buttons) {
              button.classList.toggle("is-active", button.dataset.action === action);
            }
          },
          onView: (view) => {
            for (const button of viewButtons) {
              button.classList.toggle("is-active", button.dataset.view === view);
            }
            viewEyebrow.textContent = viewTitles[view][0];
            viewTitle.textContent = viewTitles[view][1];
          },
        });

        // No initial assignment here: createDreamRoom has already pushed the
        // status for the opening view through onStatus, and overwriting it
        // would put the ground-floor hint under the whole-house view.
        for (const button of buttons) {
          button.addEventListener("click", () => room.act(button.dataset.action));
        }
        for (const button of viewButtons) {
          button.addEventListener("click", () => room.setView(button.dataset.view));
        }
        document.getElementById("reset-button").addEventListener("click", () => room.reset());
      }
    </script>
  </body>
</html>
